<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找不到頁面 — 示範訂房 | 404 — Demo Booking</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/nav-footer.css">
  <style>
    .error-page { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; text-align:center; padding: var(--space-16) var(--space-4); }
    .error-code { font-size: clamp(80px, 15vw, 160px); font-weight: 800; background: linear-gradient(135deg, var(--gold-400), var(--gold-600)); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: var(--space-4); }
    .error-title { font-family: var(--font-heading); font-size: var(--text-2xl); color: var(--color-text-primary); margin-bottom: var(--space-3); }
    .error-desc { color: var(--color-text-secondary); font-size: var(--text-lg); margin-bottom: var(--space-8); max-width: 480px; }
  </style>
</head>
<body>
  <div id="navbar-mount"></div>
  <main class="page-content" style="padding-top:100px">
    <div class="error-page">
      <div class="error-code">404</div>
      <h1 class="error-title" data-i18n="error.title">找不到頁面</h1>
      <p class="error-desc" data-i18n="error.desc">抱歉，您要尋找的頁面不存在或已被移除。</p>
      <a href="index.html" class="btn btn-accent btn-lg" data-i18n="confirm.back">回到首頁</a>
    </div>
  </main>
  <div id="footer-mount"></div>
  <script type="module">
    import { initI18n } from './js/i18n.js';
    import { initApp } from './js/navigation.js';
    initI18n(); initApp();
  </script>
</body>
</html>
