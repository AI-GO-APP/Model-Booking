<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預訂成功 — 示範訂房 | Confirmed — Demo Booking</title>
    <meta property="og:title" content="預訂成功 — 示範訂房">
  <meta property="og:description" content="您的預訂已確認">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/hero/hero.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/nav-footer.css">
  <link rel="stylesheet" href="css/pages/booking.css">
</head>
<body>
  <div id="navbar-mount"></div>
  <main class="page-content" style="padding-top: 120px; padding-bottom: var(--space-16);">
    <div class="container-narrow text-center">
      <div class="confirm-icon" style="font-size:64px; margin-bottom:var(--space-4);">✓</div>
      <h1 data-i18n="confirm.title" style="color:var(--color-success); margin-bottom:var(--space-3)">預訂成功！</h1>
      <p style="color:var(--color-text-secondary); font-size:var(--text-lg); margin-bottom:var(--space-8)" data-i18n="confirm.subtitle">感謝您的預訂，我們期待您的到來</p>

      <div class="card-glass" style="padding:var(--space-8); text-align:left; margin-bottom:var(--space-6)">
        <div class="summary-row" style="display:flex; justify-content:space-between; padding:var(--space-2) 0">
          <span data-i18n="confirm.order.id">訂單編號</span>
          <span style="font-family:var(--font-number); font-weight:600" id="order-id">DB-20260409-0001</span>
        </div>
        <hr class="divider">
        <div id="confirm-details"></div>
        <hr class="divider">
        <h4 style="margin-bottom:var(--space-3)" data-i18n="confirm.guide">入住指南</h4>
        <p style="font-size:var(--text-sm); color:var(--color-text-secondary)" data-i18n="confirm.checkin.time">入住時間：下午 3:00 後</p>
        <p style="font-size:var(--text-sm); color:var(--color-text-secondary)" data-i18n="confirm.checkout.time">退房時間：上午 11:00 前</p>
        <p style="font-size:var(--text-sm); color:var(--color-text-secondary)" data-i18n="contact.address.value">208 新北市金山區中山路 168 號</p>
        <p style="font-size:var(--text-sm); color:var(--color-text-secondary)">02-2498-8888</p>
      </div>

      <div class="flex gap-4 justify-center">
        <button class="btn btn-outline" onclick="window.print()" data-i18n="confirm.print">列印</button>
        <a href="index.html" class="btn btn-primary" data-i18n="confirm.back">回到首頁</a>
      </div>
    </div>
  </main>
  <div id="footer-mount"></div>
  <script type="module">
    import { initI18n, t, getLang } from './js/i18n.js';
    import { initApp } from './js/navigation.js';
    import { getRoomById, rooms as staticRooms } from './js/data/rooms.js';
    import { isLoggedIn } from './js/api/auth.js';
    import { fetchRoomBySlug } from './js/api/rooms.js';
    initI18n(); initApp();
    const lang = getLang();
    const params = new URLSearchParams(window.location.search);
    let room = getRoomById(params.get('room')) || staticRooms[0];
    const total = params.get('total') || room.price;
    const nights = params.get('nights') || 1;
    const orderId = params.get('orderId') || '';
    const orderName = decodeURIComponent(params.get('orderName') || '');

    // 顯示訂單編號：優先用 AI GO 真實訂單名稱，fallback 為隨機
    const displayOrderId = orderName || orderId?.substring(0, 8) || `DB-${new Date().toISOString().split('T')[0].replace(/-/g,'')}-${String(Math.floor(Math.random()*9999)).padStart(4,'0')}`;
    document.getElementById('order-id').textContent = displayOrderId;

    document.getElementById('confirm-details').innerHTML = `
      <div style="display:flex;justify-content:space-between;padding:var(--space-2) 0;font-size:var(--text-sm)"><span>${t('nav.rooms')}</span><span>${lang==='en'?room.nameEn:room.name}</span></div>
      <div style="display:flex;justify-content:space-between;padding:var(--space-2) 0;font-size:var(--text-sm)"><span>${lang==='en' ? 'Nights' : '住宿晚數'}</span><span>${nights} ${lang==='en' ? 'night(s)' : '晚'}</span></div>
      <div style="display:flex;justify-content:space-between;padding:var(--space-2) 0;font-size:var(--text-sm)"><span>${t('booking.total')}</span><span style="font-weight:700;color:var(--color-accent)">${t('common.currency')} ${Number(total).toLocaleString()}</span></div>
    `;
    window.addEventListener('langchange', () => location.reload());
  </script>
</body>
</html>
